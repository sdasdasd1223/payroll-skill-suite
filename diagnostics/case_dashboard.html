<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公司薪資案件檔案</title>
<style>body{font:16px system-ui,sans-serif;margin:0;background:#f1f4f8;color:#17283e}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}.note{color:#516176;line-height:1.7}.filters{display:flex;gap:14px;flex-wrap:wrap;background:white;border-radius:12px;padding:18px;margin:20px 0}label{display:flex;flex:1;min-width:180px;flex-direction:column;gap:7px}input{font:inherit;padding:10px;border:1px solid #a9b8ca;border-radius:6px;width:100%;box-sizing:border-box}.case{background:white;border:1px solid #dbe2ed;border-radius:12px;padding:20px;margin:14px 0;overflow-wrap:anywhere}.small{font-size:14px;color:#516176}.warning{color:#8a4b00;background:#fff3d8;padding:10px;border-radius:6px}button,a{font:inherit;color:#075c9f}button{background:#eaf3fc;border:1px solid #9abbd9;border-radius:6px;padding:7px 12px;cursor:pointer}.files{display:grid;gap:8px;margin:12px 0}.message{white-space:pre-wrap;background:#f3f7fc;padding:12px;border-radius:7px;line-height:1.6;margin:8px 0}.messages{max-height:500px;overflow:auto}h2{font-size:19px}summary{cursor:pointer}#error{color:#a21f24}</style>
<main><h1>公司薪資案件檔案</h1><div class="note">限授權管理員於本機查看。可按月份、薪資人員或經辦人資找案件，再下載原件、計算結果及查看已綁定輪次的對話。畫面為開啟時的歸檔快照；保存不代表已核准發薪。</div>
<div class="filters"><label>所屬月份<input id="month" type="month"></label><label>薪資人員<input id="employee" placeholder="姓名、員工編號或公司"></label><label>經辦人資<input id="operator" placeholder="設備登記名稱或經辦姓名"></label></div>
<p id="count">正在讀取案件…</p><p id="error"></p><div id="cases"></div></main>
<script>
const prefix=location.pathname.replace(/\/$/,'');const $=id=>document.getElementById(id);const kinds={source:'原始文件',result:'計算結果',conversation:'案件對話',run_record:'執行記錄',template:'指定模板'};let generation=0;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function load(){const request=++generation;const query=new URLSearchParams();for(const key of ['month','employee','operator'])if($(key).value)query.set(key,$(key).value);try{const r=await fetch(prefix+'/api/cases?'+query);if(!r.ok)throw Error();const data=await r.json();if(request!==generation)return;$('count').textContent='找到 '+data.cases.length+' 個案件版本；同案件的修正前後版本均保留。';$('error').textContent='';$('cases').replaceChildren();for(const item of data.cases){const card=el('section',undefined,'case');card.append(el('h2',item.month+' · '+item.executor_label));card.append(el('div','經辦填報姓名：'+item.operator.name+'　｜　保存時間：'+new Date(item.created_at).toLocaleString('zh-TW'),'small'));card.append(el('p','薪資人員：'+item.employees.map(p=>p.company+'／'+p.name+'（'+p.employee_key+'）').join('、')));card.append(el('div','案件 '+item.case_id+'　版本 '+item.event_id,'small'));if(item.synthetic_only)card.append(el('p','合成測試案件，非真實薪資','warning'));const state=item.conversation_state;card.append(el('p',state==='completed_visible_text'?'綁定輪次的可見文字已保存。':'對話尚未完整保存：'+({in_progress:'輪次仍在進行，等待背景補存',not_bound:'尚未綁定對話',unavailable:'讀取失敗，等待重試'}[state]||state),state==='completed_visible_text'?'small':'warning'));for(const warning of item.issues||[])card.append(el('p',warning,'warning'));const files=el('div',undefined,'files');for(const f of item.files){const a=el('a',(kinds[f.role]||f.role)+'：'+f.name+' · '+f.bytes.toLocaleString()+' 位元組');a.href=prefix+'/api/file/'+item.event_id+'/'+f.file_id;files.append(a)}card.append(files);if(item.files.some(f=>f.role==='conversation')){const details=el('details');details.append(el('summary','查看案件對話'));const messages=el('div',undefined,'messages');details.append(messages);details.addEventListener('toggle',async()=>{if(!details.open||messages.childNodes.length)return;try{const r=await fetch(prefix+'/api/conversation/'+item.event_id);if(!r.ok)throw Error();const c=await r.json();messages.append(el('p','僅包含已綁定輪次的使用者與助理可見文字；工具只存狀態摘要，非文字附件未必包含。','small'));for(const m of c.messages)messages.append(el('div',(m.role==='user'?'使用者':'助理')+'\n'+m.text,'message'));}catch{messages.append(el('p','對話驗證或讀取失敗，未當成完整顯示。','warning'))}});card.append(details)}$('cases').append(card)}}catch{$('error').textContent='案件讀取失敗，不能把舊畫面當成最新歸檔。'}}
let timer;for(const id of ['month','employee','operator'])$(id).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,150)});load();
</script></html>
