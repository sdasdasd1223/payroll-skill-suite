<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:"><title>薪资诊断管理员查看页</title><style>body{margin:0;background:#f3f6f8;color:#163247;font:16px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1280px;margin:auto;padding:28px}section{background:white;border:1px solid #dbe4eb;border-radius:10px;padding:22px;margin:16px 0}h1{font-size:27px}label{display:inline-block;margin-right:20px}input,select{font:inherit;padding:5px;border:1px solid #9fb5c5;border-radius:5px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;border-bottom:1px solid #dbe4eb;text-align:left;vertical-align:top}th{background:#eaf2f6}.scroll{overflow:auto}.muted{color:#617888}.bad{color:#a62f2f}.good{color:#176b50}details pre{white-space:pre-wrap;word-break:break-all;font-size:13px}button{font:inherit;padding:6px 12px}#counts{font-size:20px;font-weight:bold}@media(max-width:600px){main{padding:14px}section{padding:14px}label{display:block;margin:8px 0}}</style><main><h1>薪资诊断管理员查看页</h1><p class="muted">本页由管理员密钥在本机生成，仅限授权管理员保存与查看。数据更新需重新同步；这里不是完整聊天、工资原件或发薪批准。</p><section><p class="muted">__SYNC_NOTICE__</p><div id="counts"></div><label>月份 <input id="month" placeholder="例如 2026-09"></label><label>状态 <select id="state"><option value="">全部</option><option value="passed">检查通过</option><option value="pending">存在待核</option><option value="failed">检查失败</option><option value="exception">程序异常</option><option value="completed_unverified">运行完成、结论未核</option></select></label><label>设备 <select id="device"><option value="">全部</option></select></label></section><section><div class="scroll"><table><thead><tr><th>开始时间（北京时间）</th><th>设备／月份</th><th>环节／版本</th><th>实际结果</th><th>诊断详情</th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="muted">0个错误不等于工资准确率100%；未知金额与人工确认仍以实际核算记录为准。</p></main><script>
const data=__DIAGNOSTIC_ROWS__;
const labels={workflow_audit:'全流程检查',crossstage_audit:'跨环节检查',audit_payroll_workbook:'工资公式检查',process_attendance:'考勤初算',insurance_merge:'五险一金并表',diagnostics_smoke:'明确合成连通测试',passed:'检查通过',pending:'存在待核',failed:'检查失败',exception:'程序异常',completed_unverified:'运行完成、结论未核',SOURCE_CHANGED:'来源版本变化',TEMPLATE_MISMATCH:'模板或批注不符',FORMULA_INVALID:'公式异常',CONFIRMATION_MISSING:'确认资料未齐',ATTENDANCE_HANDOFF:'假别交接问题',REWARD_EVIDENCE:'奖励证据问题',SCOPE_INCOMPLETE:'人员范围问题',OTHER:'其他检查问题'};
const devices=document.querySelector('#device');for(const name of [...new Set(data.map(x=>x.device_label))]){const o=document.createElement('option');o.value=name;o.textContent=name;devices.append(o)}
function when(value){const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'时间未核'}
function cell(tr,text){const td=document.createElement('td');td.textContent=text;tr.append(td);return td}
const stageLabels={attendance:'考勤',insurance:'五险一金',payroll:'工资',tax:'个税',payslip:'工资单'};
const roleLabels={attendance_raw:'原始考勤',attendance_confirmed:'已确认考勤',payroll_confirmed:'已确认工资',reward_claims:'奖励问卷',overtime:'加班登记',roster:'人员名册',insurance:'保险',template:'模板',output:'检查产出',record:'核算记录',other:'其他实际来源'};
function versions(items){return (items||[]).map(x=>({文件版本标识:x.sha256,字节数:x.bytes,文件类型:x.extension,用途:roleLabels[x.role]||'其他实际来源'}))}
function render(){const rows=data.filter(x=>(!month.value||String(x.month||'').includes(month.value))&&(!state.value||x.state===state.value)&&(!devices.value||x.device_label===devices.value));document.querySelector('#counts').textContent=`当前显示 ${rows.length} 条记录／已读取 ${data.length} 条`;const body=document.querySelector('#rows');body.replaceChildren();for(const x of rows){const tr=document.createElement('tr');cell(tr,when(x.started_at));cell(tr,x.device_label+'\n'+(x.month||'月份未提供'));cell(tr,(labels[x.component]||'已登记入口')+'\n'+x.policy_version);cell(tr,(labels[x.state]||'待核')+'；错误 '+(x.error_count??'未提供')+'；待核 '+(x.pending_count??'未提供'));const td=cell(tr,'');const detail=document.createElement('details'),title=document.createElement('summary'),pre=document.createElement('pre');title.textContent='查看文件版本与检查分类';const translated={事件编号:x.event_id,耗时毫秒:x.duration_ms,核算人数:x.employee_count??'未提供',错误分类:Object.fromEntries(Object.entries(x.category_counts||{}).map(([k,v])=>[labels[k]||'其他检查问题',v])),已引用来源总数:x.source_file_count,本次版本摘要上限:x.source_versions_limit,来源版本:versions(x.source_versions),产出版本:versions(x.output_versions),所需阶段:(x.required_stages||[]).map(k=>stageLabels[k]||k),已核阶段:(x.verified_stages||[]).map(k=>stageLabels[k]||k),正式条件已齐:x.formal_ready?'是':'否',明确合成:x.synthetic_only===true?'是':'否'};pre.textContent=JSON.stringify(translated,null,2);detail.append(title,pre);td.append(detail);body.append(tr)}}
const month=document.querySelector('#month'),state=document.querySelector('#state');for(const el of [month,state,devices])el.addEventListener('input',render);render();
</script></html>
