name: 薪資套件安裝檢查
on: [push, pull_request, workflow_dispatch]
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl
      - run: python tests/test_reward_absolute_dates_public.py
      - run: python tests/test_crossstage_public.py
      - name: Windows 安裝與升級
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target=Join-Path $env:RUNNER_TEMP 'payroll-clean'
          ./install.ps1 -CodexHome $target
          ./install.ps1 -CodexHome $target
      - name: macOS 安裝與升級
        if: runner.os == 'macOS'
        shell: bash
        run: |
          target="$(mktemp -d)"
          bash install.sh "$target"
          bash install.sh "$target"
